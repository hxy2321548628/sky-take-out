# ============================================================
# 容器内运行（SPRING_PROFILES_ACTIVE=docker）
# 所有外部依赖地址都来自环境变量 —— 同一个镜像可以跑在 compose / K8s / 任意环境
# ============================================================
sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${SKY_DB_HOST:mysql}
    port: ${SKY_DB_PORT:3306}
    database: ${SKY_DB_NAME:sky_take_out}
    username: ${SKY_DB_USER:root}
    password: ${SKY_DB_PASSWORD:root}

spring:
  redis:
    host: ${SKY_REDIS_HOST:redis}
    port: ${SKY_REDIS_PORT:6379}
    database: ${SKY_REDIS_DATABASE:0}

logging:
  level:
    root: info
