server:
  port: ${SERVER_PORT:8080}
  # 优雅停机：收到 SIGTERM 后先停止接收新请求，等在途请求处理完再退出
  shutdown: graceful

spring:
  application:
    name: sky-server
  # 默认 dev（本机 IDE）；容器里由 SPRING_PROFILES_ACTIVE=docker 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 与 server.shutdown 配合：给在途请求留的排水时间
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    allow-circular-references: true
  # Springfox 3.0 只认 Ant 风格的 PatternsRequestCondition；
  # Boot 2.6+ 默认 PathPatternParser，加上 Actuator 后会触发
  # `PatternsRequestCondition ... is null` 的 NPE，必须显式回退。
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}

  # Redis：课程第二课开始才会真正用到，但先配好，Actuator 的健康检查也依赖它
  redis:
    host: ${SKY_REDIS_HOST:localhost}
    port: ${SKY_REDIS_PORT:6379}
    database: ${SKY_REDIS_DATABASE:0}

  # 数据库版本管理：表结构只认 resources/db/migration 下的脚本
  flyway:
    enabled: ${SKY_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    # 现有数据卷里没有 flyway_schema_history，不允许自动 baseline，
    # 否则会在"已经有表"的库上直接跑 V1 造成误判。迁移前请 task db:reset。
    baseline-on-migrate: false

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

# 健康检查 / 探针（Dockerfile HEALTHCHECK、docker compose 的 service_healthy 都依赖它）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true # 提供 /actuator/health/liveness 和 /readiness
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: ${spring.application.name}
    description: 苍穹外卖

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥（生产环境务必用 SKY_JWT_ADMIN_SECRET 覆盖）
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET:itcast}
    # 设置jwt过期时间
    admin-ttl: ${SKY_JWT_ADMIN_TTL:7200000}
    # 设置前端传递过来的令牌名称
    admin-token-name: ${SKY_JWT_ADMIN_TOKEN_NAME:token}
    user-secret-key: ${SKY_JWT_USER_SECRET:itcast}
    user-ttl: ${SKY_JWT_USER_TTL:7200000}
    user-token-name: ${SKY_JWT_USER_TOKEN_NAME:authentication}
